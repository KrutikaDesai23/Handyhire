<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - On-Demand Service Provider Hiring Platform. Connect with skilled professionals or offer your services." />
    <meta name="theme-color" content="#68865C" />
    <title>Welcome | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
    <main class="welcome-screen" role="main">
        <header class="welcome-header">
            <h1 class="welcome-title">WELCOME</h1>
            <p class="welcome-subtitle">Household Help, Hassle-Free.</p>
        </header>

        <section class="welcome-actions" aria-label="Account selection">
            <button
                type="button"
                class="action-btn"
                id="provideServiceBtn"
                aria-label="Provide a service - Continue as a service provider"
            >
                WORKER
            </button>

            <button
                type="button"
                class="action-btn"
                id="acquireServiceBtn"
                aria-label="Acquire a service - Continue as a customer"
            >
               USER
            </button>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
