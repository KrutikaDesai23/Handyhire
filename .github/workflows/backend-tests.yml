name: Backend tests

on:
  push:
    branches: [main, competition-readiness-fixes]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check local script references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const htmlFiles = walk('pages').filter((file) => file.endsWith('.html'));
          const missing = [];

          for (const htmlFile of htmlFiles) {
            const html = fs.readFileSync(htmlFile, 'utf8');
            const scripts = [...html.matchAll(/<script\\b[^>]*\\bsrc=["']([^"']+)["']/gi)];
            for (const match of scripts) {
              const src = match[1];
              if (/^(?:[a-z]+:)?\\/\\//i.test(src)) continue;
              const target = path.resolve(path.dirname(htmlFile), src);
              if (!fs.existsSync(target)) missing.push(`${htmlFile} -> ${src}`);
            }
          }

          if (missing.length) {
            console.error('Missing local JavaScript files:\\n' + missing.join('\\n'));
            process.exit(1);
          }

          console.log(`Checked local script references in ${htmlFiles.length} pages.`);
          NODE

  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./handyhire_test.db
          SECRET_KEY: test-secret-key
        run: pytest -q
