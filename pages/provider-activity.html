<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
        name="description"
        content="HandyHire - View jobs received and workers hired."
    />
    <meta name="theme-color" content="#68865C" />

    <title>Activity | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/provider-activity.css" />
</head>

<body>
    <header class="app-header" role="banner">
        <a
            href="provider-home.html"
            class="brand-mark"
            aria-label="HandyHire home"
        >
            <img
                src="../Images/Hamor.jpeg"
                alt="HandyHire Logo"
                class="brand-logo"
            />
        </a>

        <nav class="app-nav" aria-label="Primary navigation">
            <a href="provider-home.html" class="nav-tab">Home</a>

            <a
                href="provider-request.html"
                class="nav-tab"
                id="requestTab"
            >
                Request
                <span
                    class="nav-count"
                    data-request-count
                    hidden
                >0</span>
            </a>

            <a
                href="provider-activity.html"
                class="nav-tab is-active"
                id="activityTab"
                aria-current="page"
            >
                Activity
            </a>

            <a
                href="provider-worker-profile.html"
                class="nav-tab"
                id="profileTab"
            >
                Profile
            </a>
        </nav>

        <span class="icon-btn-spacer" aria-hidden="true"></span>
    </header>

    <main class="app-main" role="main">
        <section class="page-heading" aria-labelledby="activityTitle">
            <div>
                <p class="page-kicker">WORKSPACE</p>
                <h1 id="activityTitle">Activity</h1>
                <p class="page-subtitle">
                    Track active jobs, completed work and workers you have hired.
                </p>
            </div>
        </section>

        <section class="activity-controls" aria-label="Activity controls">
            <div
                class="activity-mode-tabs"
                id="activityModeTabs"
                role="tablist"
                aria-label="Choose activity type"
            >
                <button
                    type="button"
                    class="activity-mode-tab is-active"
                    data-mode="received"
                    role="tab"
                    aria-selected="true"
                >
                    Jobs Received
                </button>

                <button
                    type="button"
                    class="activity-mode-tab"
                    data-mode="sent"
                    role="tab"
                    aria-selected="false"
                >
                    Workers Hired
                </button>
            </div>

            <label class="visually-hidden" for="activitySearch">
                Search activity
            </label>

            <div class="search-wrap">
                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>

                <input
                    type="search"
                    id="activitySearch"
                    class="search-input"
                    placeholder="Search jobs received"
                    autocomplete="off"
                />
            </div>
        </section>

        <section class="activity-feed" aria-label="Provider activity">
            <div id="activityFeed"></div>

            <p class="empty-state" id="emptyState" hidden>
                No activity yet.
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/provider-activity.js"></script>
</body>
</html>
