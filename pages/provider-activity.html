<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="description"
        content="HandyHire - View your booking history and activity."
    />

    <meta name="theme-color" content="#68865C" />

    <title>Activity | HandyHire</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Activity CSS -->
    <link
        rel="stylesheet"
        href="../css/provider-activity.css"
    />
</head>

<body>

    <!-- ========================================
         TOP NAVIGATION
         ======================================== -->

    <header class="app-header" role="banner">

        <!-- HandyHire Logo -->
        <a
            href="provider-home.html"
            class="brand-mark"
            aria-label="HandyHire home"
        >
            <img
                src="../Images/Hamor.jpeg"
                alt="HandyHire Logo"
                class="brand-logo"
            />
        </a>


        <!-- Navigation Tabs -->
        <nav
            class="app-nav"
            aria-label="Primary navigation"
        >

            <!-- Home -->
            <a
                href="provider-home.html"
                class="nav-tab"
            >
                Home
            </a>


            <!-- Request -->
            <a
                href="provider-request.html"
                class="nav-tab"
                id="requestTab"
            >
                Request

                <span
                    class="nav-count"
                    data-request-count
                    hidden
                >
                    0
                </span>
            </a>


            <!-- Activity -->
            <a
                href="provider-activity.html"
                class="nav-tab is-active"
                id="activityTab"
                aria-current="page"
            >
                Activity
            </a>


            <!-- Profile -->
            <a
                href="provider-worker-profile.html"
                class="nav-tab"
                id="profileTab"
            >
                Profile
            </a>

        </nav>


        <!-- Keeps navbar centered -->
        <span
            class="icon-btn-spacer"
            aria-hidden="true"
        ></span>

    </header>



    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main
        class="app-main"
        role="main"
    >


        <!-- ========================================
             SEARCH BAR
             ======================================== -->

        <section
            class="search-section"
            aria-label="Search bookings"
        >

            <label
                class="visually-hidden"
                for="activitySearch"
            >
                Search bookings
            </label>


            <div class="search-wrap">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    &#128269;
                </span>


                <input
                    type="search"
                    id="activitySearch"
                    class="search-input"
                    placeholder="Search for ur preference"
                    autocomplete="off"
                />

            </div>

        </section>



        <!-- ========================================
             BOOKING HISTORY
             ======================================== -->

        <section
            class="activity-feed"
            aria-label="Booking history"
        >

            <div id="activityFeed">

                <!--
                    Booking sections are rendered
                    dynamically by provider-activity.js
                -->

            </div>


            <!-- Empty / Loading / Error State -->
            <p
                class="empty-state"
                id="emptyState"
                hidden
            >
                No bookings match your search.
            </p>

        </section>

    </main>



    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <!--
        IMPORTANT:
        api.js MUST load before provider-activity.js
        because provider-activity.js uses
        window.HandyHireAPI.apiFetch()
    -->

    <script src="../js/api.js"></script>

    <script src="../js/provider-activity.js"></script>


</body>

</html>
