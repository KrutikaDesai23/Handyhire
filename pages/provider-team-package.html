<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - Team-based service packages grouped by category." />
    <meta name="theme-color" content="#68865C" />
    <title>Team Packages | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/provider-team-package.css" />
</head>
<body>
    <!-- ========== TOP BAR ========== -->
    <header class="pkg-topbar" role="banner">
        <a href="provider-home.html" class="brand-mark" aria-label="HandyHire home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-1.4 1.4-2.6-2.6 1.4-1.4Z" />
            </svg>
        </a>
        <span class="icon-btn-spacer" aria-hidden="true"></span>
    </header>

    <main class="pkg-page" role="main">
        <!-- ========== BACK + SEARCH ROW ========== -->
        <section class="back-search-row" aria-label="Back and search">
            <a href="provider-home.html" class="back-btn" aria-label="Back to home">
                <span class="back-icon" aria-hidden="true">&#8592;</span>
            </a>

            <label class="visually-hidden" for="packageSearch">Search packages</label>
            <div class="search-wrap">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input
                    type="search"
                    id="packageSearch"
                    class="search-input"
                    placeholder="Search for packages"
                    autocomplete="off"
                />
            </div>
        </section>

        <!-- ========== TEAM SIZE FILTER ========== -->
        <section class="filter-section" aria-label="Team size">
            <label class="filter-label" for="teamSizeSelect">Team Size</label>
            <div class="select-wrap">
                <select id="teamSizeSelect" class="team-select" aria-label="Filter packages by team size">
                    <option value="all" selected>All team sizes</option>
                    <option value="2">2 members</option>
                    <option value="3">3 members</option>
                    <option value="4">4 members</option>
                    <option value="5">5+ members</option>
                </select>
                <span class="select-caret" aria-hidden="true">&#9662;</span>
            </div>
        </section>

        <!-- ========== PACKAGE LIST ========== -->
        <section class="packages-section" aria-label="Available packages">
            <ul class="package-list" id="packageList">
                <!-- Cards rendered by js/team-package.js -->
            </ul>

            <p class="empty-state" id="emptyState" hidden>
                No packages match your filters.
            </p>
        </section>
    </main>

    <script src="../js/provider-team-package.js"></script>
</body>
</html>
