<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - Log in to your account." />
    <meta name="theme-color" content="#173f2b" />
    <title>Log In | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/customer-register.css" />
</head>
<body>
    <main class="register-screen" role="main">
        <a href="../index.html" class="auth-brand" aria-label="HandyHire home">
            <span class="brand-logo-shell"><img src="../Images/Hamor.jpeg" alt="" class="brand-logo" /></span>
            <span class="brand-name">HandyHire</span>
        </a>

        <section class="register-card auth-card-login" aria-labelledby="cardTitle">
            <div class="auth-card-heading">
                <span class="auth-kicker">WELCOME BACK</span>
                <h1 id="cardTitle" class="card-title">Log in to HandyHire</h1>
                <p class="card-subtitle">Book trusted help or manage your provider work from one place.</p>
            </div>

            <form id="loginForm" class="register-form" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                        aria-required="true"
                        aria-describedby="emailError"
                    />
                    <span class="form-error" id="emailError" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        aria-required="true"
                        aria-describedby="passwordError"
                    />
                    <span class="form-error" id="passwordError" role="alert" aria-live="polite"></span>
                </div>

                <button type="submit" class="next-btn" aria-label="Log in">Log In</button>

                <p class="auth-switch">
                    New to HandyHire? <a href="customer-register.html">Customer signup</a> <span aria-hidden="true">•</span> <a href="provider-register-step1.html">Provider signup</a>
                </p>
            </form>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
