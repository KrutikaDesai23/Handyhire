<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        name="description"
        content="HandyHire - Your booking request was sent."
    />

    <meta
        name="theme-color"
        content="#68865C"
    />

    <title>
        Booking Request Sent | HandyHire
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link
        rel="stylesheet"
        href="../css/provider-booking-success.css"
    />
</head>

<body>
    <main
        class="success-page"
        role="main"
    >
        <section
            class="success-card"
            aria-labelledby="successTitle"
        >
            <div
                class="check-wrap"
                aria-hidden="true"
            >
                <span class="check-circle">
                    <span class="check-mark">
                        &#10003;
                    </span>
                </span>
            </div>

            <h1
                class="success-title"
                id="successTitle"
            >
                Booking Request Sent
            </h1>

            <p
                class="success-subtitle"
                id="successSubtitle"
            >
                The worker will review your request.
            </p>

            <p
                class="success-subtitle"
                id="successBookingId"
            ></p>

            <p
                class="success-subtitle"
                id="successWorker"
            ></p>

            <p
                class="success-subtitle"
                id="successSchedule"
            ></p>

            <p
                class="success-subtitle"
                id="successAmount"
            ></p>

            <a
                href="provider-home.html"
                class="home-btn"
                role="button"
            >
                Home
            </a>
        </section>
    </main>

    <script src="../js/provider-booking-success.js"></script>
</body>
</html>
