<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - Find service professionals available near you." />
    <meta name="theme-color" content="#68865C" />
    <title>Near Me | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/home.css" />
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header class="app-header" role="banner">
        <a href="home.html" class="brand-mark" aria-label="HandyHire home">
    <img src="../Images/Hamor.jpeg" alt="HandyHire Logo" class="brand-logo">
</a>

        <nav class="app-nav" aria-label="Primary navigation">
            <a href="home.html" class="nav-tab is-active" aria-current="page">Home</a>
            <a href="activity.html" class="nav-tab" id="activityTab">Activity</a>
            <a href="profile.html" class="nav-tab" id="profileTab">Profile</a>
        </nav>

        <span class="icon-btn-spacer" aria-hidden="true"></span>
    </header>

    <main class="app-main" role="main">
        <!-- ========== HERO BANNER ========== -->
        <section class="hero-banner" aria-label="Promotional banner">
            <div class="hero-image" role="img" aria-label="HandyHire promotional banner"></div>
        </section>

        <!-- ========== FILTER CHIPS ========== -->
        <section class="filter-chips" aria-label="Service filters">
            <button type="button" class="chip" data-filter="all" data-target="home.html">All</button>
            <button type="button" class="chip" data-filter="pre-booking" data-target="home-prebooking.html">Pre-booking</button>
            <button type="button" class="chip" data-filter="on-spot" data-target="home-onspot.html">On-spot</button>
            <button type="button" class="chip is-active" data-filter="near-me" aria-pressed="true">Near me</button>
        </section>

        <!-- ========== SERVICE GRID ========== -->
        <section class="service-section" aria-labelledby="workersHeading">
            <h2 id="workersHeading" class="visually-hidden">Service professionals near you</h2>

            <div class="service-grid" id="serviceGrid">
                <!-- Cards are rendered by js/home-nearme.js -->
            </div>
        </section>

        <!-- ========== PACKAGE TILES ========== -->
        <section class="pkg-section" aria-label="Service packages">
            <a href="multitasking-package.html" class="pkg-tile" aria-label="Open multitasking packages">
                <span class="pkg-tile-text">
                    <span class="pkg-tile-title">Multitasking packages</span>
                    <span class="pkg-tile-subtitle">Browse multi-skill professionals</span>
                </span>
                <span class="pkg-tile-arrow" aria-hidden="true">&#8250;</span>
            </a>
            <a href="team-package.html" class="pkg-tile" aria-label="Open team packages">
                <span class="pkg-tile-text">
                    <span class="pkg-tile-title">Team packages</span>
                    <span class="pkg-tile-subtitle">Hire a coordinated team for bigger jobs</span>
                </span>
                <span class="pkg-tile-arrow" aria-hidden="true">&#8250;</span>
            </a>
        </section>

        <!-- ========== BOTTOM PROMOTIONAL BANNER ========== -->
        <section class="promo-section" aria-label="Promotions">
            <article class="promo-card promo-card--primary">
                <div class="promo-text">
                    <h3 class="promo-title">Refer &amp; Earn</h3>
                    <p class="promo-subtitle">Invite friends and earn service credits.</p>
                </div>
                <div class="promo-icon" aria-hidden="true">&#127873;</div>
            </article>

            <article class="promo-card promo-card--secondary">
                <div class="promo-text">
                    <h3 class="promo-title">Become a Provider</h3>
                    <p class="promo-subtitle">Offer your skills and grow your business.</p>
                </div>
                <div class="promo-icon" aria-hidden="true">&#128188;</div>
            </article>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/worker-browse.js"></script>
    <script src="../js/home-nearme.js"></script>
</body>
</html>
