<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - Preparing your provider setup." />
    <meta name="theme-color" content="#123523" />
    <title>Getting Ready | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/provider-animation.css" />
</head>
<body>
    <main class="anim-page" role="main">
        <div class="launch-grid" aria-hidden="true"></div>
        <div class="launch-word" aria-hidden="true">HANDYHIRE</div>
        <div class="launch-streaks" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>

        <section class="anim-stage" aria-label="Preparing HandyHire provider setup">
            <div class="orbit-system" aria-hidden="true">
                <span class="orbit orbit-one"></span>
                <span class="orbit orbit-two"></span>
                <span class="orbit orbit-three"></span>
                <span class="orbit-spark spark-one"></span>
                <span class="orbit-spark spark-two"></span>
                <span class="orbit-spark spark-three"></span>

                <div class="anim-logo">
                    <span class="anim-logo-shell">
                        <img src="../Images/Hamor.jpeg" alt="" class="anim-logo-image" />
                    </span>
                </div>
            </div>

            <div class="launch-copy">
                <span class="anim-kicker">HANDYHIRE PROVIDER</span>
                <h1 class="anim-title">Skills. Jobs.<br><span>Momentum.</span></h1>
                <p class="anim-tagline">Turning your skills into trusted work opportunities.</p>

                <div class="anim-progress" aria-hidden="true">
                    <span class="anim-progress-bar"></span>
                </div>
                <p class="anim-status"><span></span> Preparing your professional workspace</p>

                <a href="provider-register-step1.html" class="anim-skip">Skip intro →</a>
            </div>
        </section>

        <span class="launch-curtain" aria-hidden="true"></span>
    </main>

    <script src="../js/provider-animation.js"></script>
</body>
</html>
