<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="HandyHire - Customer profile." />
    <meta name="theme-color" content="#68865C" />
    <title>Profile | HandyHire</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>
    <!-- ========== TOP BAR ========== -->
    <header class="profile-topbar" role="banner">
        <a href="home.html" class="brand-mark" aria-label="HandyHire home">
    <img src="../Images/Hamor.jpeg" alt="HandyHire Logo" class="brand-logo">
</a>

        <nav class="app-nav" aria-label="Primary navigation">
            <a href="home.html" class="nav-tab">Home</a>
            <a href="activity.html" class="nav-tab">Activity</a>
            <a href="profile.html" class="nav-tab is-active" aria-current="page">Profile</a>
        </nav>

        <span class="icon-btn-spacer" aria-hidden="true"></span>
    </header>

    <main class="profile-page" role="main">

        <!-- ========== PROFILE HERO ========== -->
        <section class="profile-hero-card" aria-label="Profile header">
            <div class="profile-hero-avatar" id="profileHeroAvatar" aria-hidden="true"></div>
            <h1 class="profile-hero-name" id="profileHeroName">Loading...</h1>
            <span class="profile-hero-badge">CUSTOMER</span>
            <p class="profile-hero-tagline">Manage your HandyHire account &amp; services</p>
        </section>


        <!-- ========== PERSONAL INFORMATION ========== -->
        <section class="profile-section" aria-label="Personal information">
            <h2 class="section-title">Personal Information</h2>
            <div class="info-card-list">
                <div class="info-card">
                    <span class="info-card-icon" aria-hidden="true">&#128100;</span>
                    <div class="info-card-text">
                        <p class="info-card-label">Full Name</p>
                        <p class="info-card-value" id="infoFullName">--</p>
                    </div>
                </div>
                <div class="info-card">
                    <span class="info-card-icon" aria-hidden="true">&#128241;</span>
                    <div class="info-card-text">
                        <p class="info-card-label">Mobile Number</p>
                        <p class="info-card-value" id="infoMobile">--</p>
                    </div>
                </div>
                <div class="info-card">
                    <span class="info-card-icon" aria-hidden="true">&#9993;</span>
                    <div class="info-card-text">
                        <p class="info-card-label">Email</p>
                        <p class="info-card-value" id="infoEmail">--</p>
                    </div>
                </div>
                <div class="info-card">
                    <span class="info-card-icon" aria-hidden="true">&#127968;</span>
                    <div class="info-card-text">
                        <p class="info-card-label">Address</p>
                        <p class="info-card-value" id="infoAddress">--</p>
                    </div>
                </div>
                <div class="info-card">
                    <span class="info-card-icon" aria-hidden="true">&#127970;</span>
                    <div class="info-card-text">
                        <p class="info-card-label">City</p>
                        <p class="info-card-value" id="infoCity">--</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ========== EDIT PROFILE ========== -->
        <section class="profile-section" aria-label="Edit profile">
            <button type="button" class="edit-profile-btn" id="editProfileBtn">Edit Profile</button>

            <form class="edit-form" id="editProfileForm" hidden>
                <div class="field">
                    <label for="editFullName">Full Name</label>
                    <input type="text" id="editFullName" name="full_name" autocomplete="name" />
                </div>
                <div class="field">
                    <label for="editEmail">Email</label>
                    <input type="email" id="editEmail" name="email" />
                </div>
                <div class="field">
                    <label for="editMobile">Mobile Number</label>
                    <input type="text" id="editMobile" name="mobile_number" />
                </div>
                <div class="field">
                    <label for="editAddress">Address</label>
                    <input type="text" id="editAddress" name="address" />
                </div>
                <div class="field">
                    <label for="editCity">City</label>
                    <input type="text" id="editCity" name="city" />
                </div>

                <p class="edit-error" id="editError" hidden role="alert"></p>

                <div class="edit-actions">
                    <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveProfileBtn">Save Changes</button>
                </div>
            </form>
        </section>

        <!-- ========== MEMBER STATUS ========== -->
        <section class="member-card" aria-label="Account status">
            <span class="member-icon" aria-hidden="true">&#127942;</span>
            <div class="member-text">
                <p class="member-title">HandyHire Member</p>
                <p class="member-desc">Your account is ready to book trusted professionals.</p>
            </div>
        </section>

        <!-- ========== SIGN OUT ========== -->
        <button type="button" class="signout-btn" id="signOutBtn">Sign Out</button>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
